# Worked example - the DSL-Demo-f2026 cohort's schedule + auto-release plan, in one file
# (classroom-config/schedule.yml). Each materials_releases entry is a `event_datetime` (when
# the thing happens - what the site's schedule shows); the hourly cron fires its actions at
# that moment, except deploys carrying their own `deploy_datetime`. Sources are read from the COURSE org;
# destinations written to this COHORT org. Full schema:
# docs/DEPLOYMENT-CHECKLIST.md#scheduleyml
#
# Changing a date later? Just commit the edit to this file on main - the GitHub web UI
# is the recommended way (or edit a local clone, commit, push). The hourly cron reads
# whatever is on main at each tick, so the change simply takes effect within the hour.
# Only already-fired ONE-SHOT actions don't rewind: a release already shipped stays
# shipped, and a snapshot/autograde that already ran needs its marker deleted to redo.
timezone: Europe/Berlin

materials_releases:
  # Deploys are MINIMAL where the defaults fit: only source_repo + source_path are
  # required; dest_repo defaults to `materials`, dest_path mirrors source_path, and each
  # copy ships at the entry's event_datetime. The lecture lines add ONE option -
  # deploy_datetime - to ship an hour before class. (Paths are relative to their repo.)
  course-intro:
    event_datetime: 2026-08-31T09:00   # week 0 - the course opens before teaching starts
    title: Course opens
    deploy:
      # Root files are ordinary paths: name the actual file (there is no syllabus glob).
      - source_repo: course-materials-f2026
        source_path: syllabus.md
  lecture-1:
    event_datetime: 2026-09-01T10:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: lectures/01_week-1
        deploy_datetime: 2026-09-01T09:00
      - source_repo: course-materials-f2026
        source_path: readings/01_week-1
      # release the package base early so later partial releases still import:
      - source_repo: lecture-code-f2026
        source_path: mlpkg/core
  lab-1:
    event_datetime: 2026-09-03T14:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: labs/01_week-1
  lecture-2:
    event_datetime: 2026-09-08T10:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: lectures/02_week-2
        deploy_datetime: 2026-09-08T09:00
      - source_repo: course-materials-f2026
        source_path: readings/02_week-2
  lab-2:
    event_datetime: 2026-09-10T14:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: labs/02_week-2
  lecture-3:
    event_datetime: 2026-09-15T10:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: lectures/03_week-3
        deploy_datetime: 2026-09-15T09:00
      - source_repo: course-materials-f2026
        source_path: readings/03_week-3
      # phased disclosure: reveal a topic-subpackage when you teach it
      - source_repo: lecture-code-f2026
        source_path: mlpkg/simulation
  lab-3:
    event_datetime: 2026-09-17T14:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: labs/03_week-3
  lecture-4:
    event_datetime: 2026-09-22T10:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: lectures/04_week-4
        deploy_datetime: 2026-09-22T09:00
      - source_repo: course-materials-f2026
        source_path: readings/04_week-4
  lab-4:
    event_datetime: 2026-09-24T14:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: labs/04_week-4
  lecture-5:
    event_datetime: 2026-09-29T10:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: lectures/05_week-5
        deploy_datetime: 2026-09-29T09:00
      - source_repo: course-materials-f2026
        source_path: readings/05_week-5
      - source_repo: lecture-code-f2026
        source_path: mlpkg/training
  # No actions -> a DISPLAY-ONLY event: nothing is released, the site's schedule simply
  # shows the row. (Use `deploy_datetime:` on a deploy line, as the lecture entries above
  # do, when materials should go out before the class they belong to - or leave a session
  # with no deploy at all if its materials are never released.)
  lab-5:
    event_datetime: 2026-10-01T14:00
    deploy:
      - source_repo: course-materials-f2026
        source_path: labs/05_week-5
  project-clinic:
    event_datetime: 2026-11-10T10:00
    title: Project clinic

  # `event_datetime: tbc` -> the site shows an undated TBC row; nothing can fire until a
  # real date replaces it. (`tbc: true` next to a real date marks it "(TBC)" instead.)
  guest-lecture:
    event_datetime: tbc
    title: Guest lecture (industry speaker)
semester_start: 2026-09-07
semester_end: 2026-12-18

# Autograding needs no entry here: at each assignment's grading deadline the hourly cron
# freezes the submission snapshot and runs the autograder once (individual/group comes from
# the template's own grading.yml).
assignments:                    # each assignment's whole lifecycle in one block
  assignment-1:
    handout_datetime: 2026-09-15T14:00  # provision one repo per student from assignment-1-f2026
    due_datetime: 2026-10-13            # what students see
    grading_datetime: 2026-10-15        # optional grading pin - snapshot + autograde (default = due_datetime)
  assignment-2:
    handout_datetime: 2026-09-29T14:00
    due_datetime: 2026-10-27T23:59
  assignment-4-project:
    handout_datetime: 2026-10-13T14:00
    type: group                   # per-team handout + grading (also set in the
                                  # template's grading.yml)
    due_datetime: 2026-11-15T23:59
    max_team_size: 4              # the welcome "Join team" flow refuses a 5th member


exams:
  # a bare date is a whole-day entry (the website shows 09:00); give a full datetime when
  # you know the real start time
  - name: MidTerm Exam
    exam_datetime: 2026-11-03
    tbc: true                # provisional - site shows "(TBC)"
  - name: Final Exam
    exam_datetime: 2026-12-15T14:00
