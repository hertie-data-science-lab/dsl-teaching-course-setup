name: Onboard student

# Seed this into a cohort's public `welcome` repo as
# .github/workflows/onboard.yml. Students open a "Join" issue here; the issue AUTHOR is
# the authenticated GitHub handle (unspoofable). We match the typed ENROLMENT CODE (a
# random, non-PII token the bot emailed to each student) against the PRIVATE
# classroom-config/students.csv, reject non-enrolees, record the handle + immutable GitHub
# id (building the email <-> GH-id mapping), then grant org membership + the role team the
# matched row's `role` column names: `students` (enrolled) or `auditors` (read-only - same
# released materials, no assignment repos). A roster with no `role` column is all-enrolled.
#
# Existing org ADMINS (owners - e.g. a course admin testing the student flow) get the roster
# link but no access change: granting them `member` would demote the owner.
#
# The code carries no personal data, so nothing in the public issue needs redacting; and
# because it's unguessable + single-use (the "already linked" guard), a classmate can't
# bind your roster row to their account.
#
# Runs under secrets.DSL_BOT_TOKEN, which needs, on the cohort org: Contents R/W on
# classroom-config, Members R/W (org invite + team), Issues R/W on welcome.

on:
  issues:
    types: [opened]

concurrency:
  group: onboard-roster
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  onboard:
    if: startsWith(github.event.issue.title, 'Join') && !startsWith(github.event.issue.title, 'Join team')
    runs-on: ubuntu-latest
    steps:
      - name: Match enrolment code, grant access
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DSL_BOT_TOKEN || github.token }}
          script: |
            const org    = context.repo.owner;            // the cohort org
            const issue  = context.payload.issue;
            const handle = issue.user.login;              // authenticated identity
            const userId = issue.user.id;                 // immutable - key on this
            const CONFIG = 'classroom-config', FILE = 'students.csv';

            // --- CSV, RFC-4180-ish (github-script has no npm deps, so hand-rolled).
            // The Python side writes this file with csv.writer, so a field containing a comma
            // (a name like "Doe, Jane") arrives QUOTED. A naive line.split(',') shifts every
            // column right of it, so we'd read the wrong enrol_code and write github_handle /
            // github_id into the wrong cells. Quoted fields may contain commas, newlines and
            // "" -escaped quotes; serialiseCsv re-quotes on the same rule as csv.QUOTE_MINIMAL.
            const parseCsv = (text) => {
              const rows = [];
              let row = [], field = '', quoted = false;
              for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (quoted) {
                  if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
                  else if (c === '"') { quoted = false; }
                  else { field += c; }
                  continue;
                }
                if (c === '"') { quoted = true; }
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
                else if (c !== '\r') { field += c; }
              }
              if (field !== '' || row.length) { row.push(field); rows.push(row); }
              return rows.filter(r => r.some(v => v !== ''));  // drop blank lines
            };
            const csvCell = (v) => {
              const s = (v === undefined || v === null) ? '' : String(v);
              return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            const serialiseCsv = (rows) => rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n';

            const fail = async (msg, label) => {
              await github.rest.issues.createComment({
                owner: org, repo: context.repo.repo, issue_number: issue.number, body: msg });
              await github.rest.issues.addLabels({
                owner: org, repo: context.repo.repo, issue_number: issue.number, labels: [label] });
              core.setFailed(msg.replace(/\*\*/g, ''));
            };

            if (!process.env.HAS_BOT) {
              return fail(
                `Thanks @${handle} - enrolment is **not yet armed**: the \`DSL_BOT_TOKEN\` secret is unset, ` +
                `so I can't read the private roster or invite you. A maintainer will action this.`,
                'needs-review');
            }

            // Read the enrolment code from the issue form.
            const m = (issue.body || '').match(/Enrolment code\s*[\r\n]+\s*([A-Za-z0-9-]+)/i);
            const code = m && m[1].trim();
            if (!code) return fail(
              `Thanks @${handle} - I couldn't read an **enrolment code** from the form. Please edit the issue and add it.`,
              'needs-review');

            // Read the PRIVATE roster. Columns (dsl_course.roster.FIELDS):
            // student_id,hertie_email,name,github_handle,github_id,section,enrol_code,role
            const got = await github.rest.repos.getContent({ owner: org, repo: CONFIG, path: FILE });
            const sha = got.data.sha;
            const table = parseCsv(Buffer.from(got.data.content, 'base64').toString('utf8'));
            const header = (table[0] || []).map(h => h.trim());
            // Address columns BY NAME - never by position - so a roster gaining/reordering a
            // column can't make us read a code or overwrite a handle in the wrong cell.
            const iHandle = header.indexOf('github_handle');
            const iId = header.indexOf('github_id');
            const iCode = header.indexOf('enrol_code');
            // `role` is OPTIONAL - a roster seeded before the column existed has none, and a
            // missing/blank cell means `enrolled` (dsl_course.roster.normalise_role). Never
            // required, so an older cohort's roster keeps onboarding.
            const iRole = header.indexOf('role');
            if (iHandle < 0 || iId < 0 || iCode < 0) return fail(
              `Thanks @${handle} - the roster's header is missing a required column ` +
              `(\`github_handle\`, \`github_id\`, \`enrol_code\`). A maintainer will action this.`,
              'needs-review');
            const width = header.length;
            const rows = table.slice(1).map(r => {
              while (r.length < width) r.push('');  // keep short rows addressable by index
              return r;
            });

            // Match the code to a registrar-seeded row - reject non-enrolees.
            const row = rows.find(r => r[iCode].trim().toLowerCase() === code.toLowerCase());
            if (!row) return fail(
              `Thanks @${handle} - that enrolment code isn't recognised. Check the code in your email, ` +
              `or contact the teaching team.`,
              'needs-review');
            if (row[iHandle] && row[iHandle].toLowerCase() !== handle.toLowerCase()) return fail(
              `That enrolment code is already linked to a different GitHub account. ` +
              `Contact the teaching team to resolve this.`,
              'needs-review');

            // Write the authenticated handle + immutable id back (idempotent).
            const already = row[iHandle] === handle;
            row[iHandle] = handle; row[iId] = String(userId);
            if (!already) {
              const body = serialiseCsv([header, ...rows]);
              await github.rest.repos.createOrUpdateFileContents({
                owner: org, repo: CONFIG, path: FILE, sha,
                message: `roster: link @${handle} (id ${userId})`,
                content: Buffer.from(body, 'utf8').toString('base64'),
              });
            }

            // Never DOWNGRADE org staff. A course admin is an org OWNER (`role: admin`);
            // `setMembershipForUser({ role: 'member' })` on them silently demotes the owner
            // to a plain member, which strips their access to every private repo (the org is
            // default_repository_permission=none) until someone restores it via the bot. So
            // when a Join issue comes from an admin - typically an admin testing the student
            // flow - link the roster row above (that's the useful half) and skip every
            // access-changing call.
            let orgRole = null;
            try {
              const membership = await github.rest.orgs.getMembershipForUser({ org, username: handle });
              orgRole = membership.data.role;      // 'admin' (owner) | 'member'
            } catch (e) {
              if (e.status !== 404) throw e;       // 404 = not an org member (yet) - the normal case
            }
            if (orgRole === 'admin') {
              await github.rest.issues.createComment({
                owner: org, repo: context.repo.repo, issue_number: issue.number, body: [
                  `Thanks **@${handle}** - your enrolment code is matched, and your handle + GitHub id are now linked to that roster row.`,
                  ``,
                  `- You're already an **owner/admin of \`${org}\`**, so I made **no access changes**: adding you as a \`member\` would DOWNGRADE your owner role and lock you out of the private repos.`,
                  `- Nothing else to do. To exercise the real student path end to end, re-run this from an account that isn't org staff.`,
                ].join('\n') });
              await github.rest.issues.addLabels({
                owner: org, repo: context.repo.repo, issue_number: issue.number, labels: ['staff'] });
              await github.rest.issues.update({
                owner: org, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
              return;
            }

            // Route by role: auditors are read-only (released materials, no assignments), so
            // they go to the `auditors` team; everyone else to `students`. Both teams carry
            // read on released repos - only `students` gets assignment repos + a gradebook.
            const isAuditor = iRole >= 0 && (row[iRole] || '').trim().toLowerCase() === 'auditor';
            const team = isAuditor ? 'auditors' : 'students';

            // Grant access: org membership (invites if needed) + the role team.
            await github.rest.orgs.setMembershipForUser({ org, username: handle, role: 'member' });
            await github.rest.teams.addOrUpdateMembershipForUserInOrg({
              org, team_slug: team, username: handle, role: 'member' });

            // Confirm.
            await github.rest.issues.createComment({
              owner: org, repo: context.repo.repo, issue_number: issue.number, body: [
                `Welcome **@${handle}** - your enrolment code is matched.`,
                ``,
                `- **Check your email and accept the invitation to the \`${org}\` org** - until you accept, you can't see anything here.`,
                `- Your handle + GitHub id are recorded; you've been added to the **${team}** team (unlocks released materials once you've accepted).`,
                isAuditor
                  ? `- You're enrolled as an **auditor**: you get the released materials, but no assignment repos and no grades.`
                  : `- Your assignment repos appear here once the teaching team provisions each assignment.`,
              ].join('\n') });
            await github.rest.issues.addLabels({
              owner: org, repo: context.repo.repo, issue_number: issue.number,
              labels: [isAuditor ? 'auditor' : 'enrolled'] });
            await github.rest.issues.update({
              owner: org, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
        env:
          HAS_BOT: ${{ secrets.DSL_BOT_TOKEN != '' || '' }}
