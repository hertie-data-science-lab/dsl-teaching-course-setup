# This cohort's instructors/TAs - the single source of truth for GitHub push
# access to this cohort's own team AND a course-org instructors-<tag> team (scoped
# to this year's content repos, plus the central .github repo for the central
# dispatch buttons). It also supplies this cohort's website staff cards. Course
# admins are declared at the course-org level instead (see that org's
# .github/dsl-course.yml). Sync membership reconciles this file on every push to
# it, and daily - so a start/end date rotates access with no edit on the day.
#
# What follows is a SKELETON: uncomment and fill what you want. For a filled
# example - two TAs, both photo forms, real date windows - see `people.yml.sample`.
#
# people:
#   instructors:
#     - github_handle: "janedoe"      # REQUIRED - this is what grants the access
#       name: "Prof. Jane Doe"        # optional - a card renders only WITH a name
#       title: "Professor of ..."     # optional, display only
#       photo: "/_images/pp/jane.jpg" # optional. EITHER a site-relative path to an image
#                                     # committed under `_images/pp/` in this cohort's site
#                                     # repo (that dir is served, and no sync rewrites it),
#                                     # OR an absolute URL on a host that ALLOWS
#                                     # HOTLINKING - many institutional sites return 403
#                                     # off-site, which renders as a broken image.
#       url: "https://.../profile/jane"  # optional, display only
#       start: "{year}-09-01"         # optional - no start = active immediately
#       end: "{year_next}-01-31"      # optional - no end = indefinite
#   teaching_assistants:
#     - github_handle: "anOther"
#       name: "..."
#       photo: "https://github.com/anOther.png"   # the other form: a hotlinkable URL
