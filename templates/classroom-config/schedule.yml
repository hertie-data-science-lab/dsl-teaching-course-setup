# This cohort's schedule + auto-release plan. Edit here (GitHub web UI is fine - no CLI).
# Everything is optional: anything you leave out is synthesised (semester start from the
# fYYYY tag; website exams at weeks 8 & 15) or simply not scheduled. Uncomment and fill
# what you want. Times are Europe/Berlin unless you set `timezone:` or give an explicit
# offset; the Scheduled release cron runs hourly, so times are honoured to the hour.
#
# Each block encodes BEHAVIOUR:
#   releases:     entries that DEPLOY materials (course org -> this cohort org)
#   assignments:  each assignment's handout / due / grading lifecycle
#   events:       display-only calendar rows - nothing deploys
#
# Changing a date later? Just commit the edit to this file on main - the GitHub web UI
# is the recommended way (or edit a local clone, commit, push). The hourly cron reads
# whatever is on main at each tick, so the change simply takes effect within the hour.
# Only already-fired ONE-SHOT actions don't rewind: a release already shipped stays
# shipped, and a snapshot/autograde that already ran needs its marker deleted to redo.

# timezone: Europe/Berlin              # optional - how the naive datetimes below are read

# ---------------------------------------------------------------------------
# releases: the term CALENDAR and the AUTO-RELEASE plan, in one block. Each entry is a
# label (any name you like - lecture_2, lab_1, bonus-dataset) mapping to an
# `event_datetime:` - when the thing HAPPENS, which is what the cohort site's schedule
# shows - and the deploys it ships. Deploys fire at the event_datetime unless one carries
# its own `deploy_datetime:`. The hourly Scheduled release cron does the firing
# (idempotent - safe to re-run). Sources are always read from the COURSE org;
# destinations always written to THIS cohort org.
#
# Lecture vs lab is NOT a field you set: it comes from the section folder you deploy -
# `lectures/...` renders a lecture row on the site, `labs/...` a lab row. A week with
# both is two rows.
# ---------------------------------------------------------------------------
# releases:
#
#   lecture_02:                         # MINIMAL - the recommended shape. Only
#     event_datetime: {year}-09-15T10:00  # course_source_repo + course_source_path are
#     deploy:                             # required; this lands at materials/lectures/02_intro
#       - course_source_repo: course-materials-{tag}   # at class time.
#         course_source_path: lectures/02_intro
#
#   session_2:                          # FULL - every field spelled out, for when a
#     event_datetime: {year}-09-15T10:00   # default doesn't fit. (Paths are relative to
#                                          # their repo: course_source_path inside
#                                          # course_source_repo, cohort_dest_path inside
#                                          # cohort_dest_repo.)
#     tbc: true                         # OPTIONAL: a provisional date - fires as normal,
#                                       # but the site marks it "(TBC)"
#     deploy:                           # copy one or more paths: course repo -> cohort repo
#       - course_source_repo: course-materials-{tag}   # REQUIRED - repo in the COURSE org
#         course_source_path: lectures/02_intro        # REQUIRED - folder or file to copy
#         cohort_dest_repo: materials                  # repo in THIS cohort org (default: materials)
#         cohort_dest_path: lectures/02_intro           # where to put it (default: same as course_source_path)
#         deploy_datetime: {year}-09-15T09:00     # ship THIS copy an hour before the
#                                                 # class (default: the event_datetime)
#       - course_source_repo: course-materials-{tag}
#         course_source_path: readings/02_intro   # no deploy_datetime -> out at class time
#
#   lab_1:                              # a lab is just another entry - the `labs/` folder
#     event_datetime: {year}-09-17T10:00  # below is what makes it a lab row on the site
#     deploy:
#       - course_source_repo: course-materials-{tag}
#         course_source_path: labs/01_setup
#         cohort_dest_repo: materials
#         # cohort_dest_path omitted -> mirrors course_source_path (labs/01_setup)
#
#   bonus-dataset:                      # a one-off that isn't a numbered teaching session
#     event_datetime: {year}-10-20T09:30
#     deploy:
#       - course_source_repo: course-materials-{tag}
#         course_source_path: datasets/housing.csv
#         cohort_dest_repo: materials
#         cohort_dest_path: data/housing.csv
#
#   (Assignments need NO entry here: their whole lifecycle - handout, due date, grading -
#   lives under `assignments:` below. Grading fires automatically, ONCE, at each
#   assignment's `grading_datetime`. Anything that only needs a row on the calendar -
#   an exam, a clinic, a guest lecture - goes under `events:` at the bottom.)

# ---------------------------------------------------------------------------
# The rest is for DISPLAY (website) and GRADING - not the release plan above.
# ---------------------------------------------------------------------------
# semester_start: {year}-09-07         # YYYY-MM-DD - also a row on the site's schedule
# semester_end: {year}-12-18
#
# assignments:                          # each assignment's WHOLE lifecycle, keyed by slug
#   assignment-1:                       # the slug is yours to choose
#     course_source_repo: assignment-1-{tag}  # REQUIRED: the COURSE-org repo it hands out
#                                       # from - name it, it is never guessed
#     cohort_dest_repo: homework-1      # optional: the cohort-side name (student repos,
#                                       # teams.csv key, snapshots, grades). Default: the slug
#     handout_datetime: {year}-09-22T09:00  # when to provision one repo per student (or per
#                                       # team) from that repo.
#                                       # Without it the schedule never releases this
#                                       # assignment - omit ONLY if you hand out via the
#                                       # manual "Release assignment" button (which then
#                                       # records the release moment here for you).
#                                       # Shown on the site alongside the due date.
#     due_datetime: {year}-10-13T23:59  # a bare date -> END of that day (23:59:59)
#     grading_datetime: {year}-10-15    # OPTIONAL: when the submission snapshot freezes AND
#                                       # the autograder fires (once). Not shown to students.
#                                       # Defaults to `due_datetime`.
#   assignment-2:
#     course_source_repo: assignment-2-{tag}
#     due_datetime: {year}-11-10
#   assignment-4-project:
#     handout_datetime: {year}-10-20T14:00
#     due_datetime: {year}-11-27
#     type: group                       # OPTIONAL: group | individual (can also be set
#                                       # in the template's grading.yml; default: individual)
#     max_team_size: 4                  # OPTIONAL, group assignments: the welcome repo's
#                                       # "Join team" flow refuses a member beyond this
#                                       # (default when unset: 5)
#
# events:                               # DISPLAY-ONLY calendar rows - nothing deploys
#   mid-term:
#     type: exam                        # OPTIONAL: exam | special_event (default:
#                                       # special_event). `exam` colours the row as an exam
#     title: MidTerm Exam               # OPTIONAL row label (default: prettified label)
#     event_datetime: {year}-11-03      # bare date -> a whole day (the website shows 09:00)
#     tbc: true                         # OPTIONAL: provisional - shown with a "(TBC)" marker
#   final-exam:
#     type: exam
#     title: Final Exam
#     event_datetime: {year}-12-15T14:00 # real start time, shown as given
#   resit-exam:
#     type: exam
#     title: Resit Exam
#     event_datetime: tbc               # no date at all yet -> the site shows a TBC row
#   project-clinic:                     # no `type:` -> a special event row
#     title: Project clinic
#     event_datetime: {year}-11-17T10:00
